name: Respaldo diario

# Copia cifrada de la base de datos a un bucket PRIVADO de R2, todos los días. También se puede lanzar a mano (Actions → Respaldo diario → Run).
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, BACKUP_ENCRYPTION_KEY (guárdala también en tu gestor de contraseñas: sin ella no se restaura),
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BACKUP_BUCKET (distinto del bucket público de imágenes)
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Respaldo
        run: bun scripts/backup.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          BACKUP_KEEP: '30'
